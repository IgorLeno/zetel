    <polygon class="bottom" points="13,41 50,41 43,55 6,55" stroke-width="6" stroke-linejoin="round" />
    <path class="lines" d="M27 13h21M23 19h18M20 45h23M15 51h20" fill="none" stroke-width="3" stroke-linecap="round" />
  </g>
