<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mesmas cores do ZetelMark: marca no claro, variante suavizada no escuro (SPEC-011). -->
  <style>
    .tile { fill: #faf7f2; stroke: #d9d4cc; }
    .top { fill: #f7c9b3; stroke: #f7c9b3; }
